[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
auto_detect_remappings = false
remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "permit2/=lib/permit2/",
  "solmate/=lib/solmate/"
]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "../evidence" }, { access = "read-write", path = "../deployments" }, { access = "read-write", path = "../research" }, { access = "read-write", path = "pq/deployments" }, { access = "read", path = "out-pq-mainnet" }]

[fuzz]
runs = 100000

[invariant]
runs = 10000
depth = 100
fail_on_revert = true

# Elysium testnet (Kinetiq's Arbitrum Orbit L2 on Hyperliquid), chain 99801, gas in HYPE.
# Cancun opcodes (TSTORE, MCOPY) and the canonical Permit2, CREATE2 proxy and Multicall3 are present on it.
[profile.elysium_testnet]
eth_rpc_url = "https://testnet-rpc.elysium.kinetiq.xyz"
chain_id = 99801

# Isolated Elysium PQ trust-input rehearsal. This profile compiles only the
# new PQ package with the upstream verifier's required compiler, while
# keeping the deployed Robinhood contracts on their existing compiler.
[profile.pq_testnet]
src = "pq/src"
test = "pq/test"
script = "pq/script"
out = "out-pq"
cache_path = "cache-pq"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "permit2/=lib/permit2/",
  "solmate/=lib/solmate/",
  "quip-hashsigs/=lib/hashsigs-solidity/",
  "shrincs-profile/=lib/hashsigs-solidity/contracts/profiles/256s/",
  "shrincs-hash/=lib/hashsigs-solidity/contracts/hash/keccak/"
]

# Isolated production profile for the PQ 0.8.30 package. The BELL V3 contracts
# keep their existing 0.8.26 build profile; outputs never mix with either one.
[profile.pq_mainnet]
src = "pq/src"
test = "pq/test"
script = "pq/script"
out = "out-pq-mainnet"
cache_path = "cache-pq-mainnet"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
chain_id = 4663
remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "permit2/=lib/permit2/",
  "solmate/=lib/solmate/",
  "quip-hashsigs/=lib/hashsigs-solidity/",
  "shrincs-profile/=lib/hashsigs-solidity/contracts/profiles/256s/",
  "shrincs-hash/=lib/hashsigs-solidity/contracts/hash/keccak/"
]
