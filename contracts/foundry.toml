[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
auto_detect_remappings = false
remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "permit2/=lib/permit2/",
  "solmate/=lib/solmate/"
]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "../evidence" }]

[fuzz]
runs = 100000

[invariant]
runs = 10000
depth = 100
fail_on_revert = true
