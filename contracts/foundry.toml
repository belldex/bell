[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
auto_detect_remappings = false
remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
  "permit2/=lib/permit2/",
  "solmate/=lib/solmate/"
]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "../evidence" }, { access = "read-write", path = "../deployments" }]

[fuzz]
runs = 100000

[invariant]
runs = 10000
depth = 100
fail_on_revert = true

# Elysium testnet (Kinetiq's Arbitrum Orbit L2 on Hyperliquid), chain 99801, gas in HYPE.
# Cancun opcodes (TSTORE, MCOPY) and the canonical Permit2, CREATE2 proxy and Multicall3 are present on it.
[profile.elysium_testnet]
eth_rpc_url = "https://testnet-rpc.elysium.kinetiq.xyz"
chain_id = 99801
