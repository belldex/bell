<svg xmlns="http://www.w3.org/2000/svg" width="160" height="104" viewBox="0 0 160 104">
  <!-- Patchwork tile in BELL's charcoal, warm ivory and mineral silver palette. Seven panels, dark seams, light
       stitches and a lit top edge on every panel.
       Tiles seamlessly. -->
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0EEE8"/><stop offset="1" stop-color="#E0E0DC"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#AEB2B5"/><stop offset="1" stop-color="#777C82"/></linearGradient>
    <linearGradient id="o1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#90959A"/><stop offset="1" stop-color="#73787D"/></linearGradient>
    <linearGradient id="o2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#73787D"/><stop offset="1" stop-color="#555A60"/></linearGradient>
    <linearGradient id="n1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F2123"/><stop offset="1" stop-color="#101112"/></linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0EEE8"/><stop offset="1" stop-color="#C6C7C5"/></linearGradient>
  </defs>
  <rect width="160" height="104" fill="#101112"/>
  <rect x="0"   y="0"  width="60"  height="38"  fill="url(#b1)"/>
  <rect x="60"  y="0"  width="100" height="24"  fill="url(#n1)"/>
  <rect x="60"  y="24" width="42"  height="46"  fill="url(#o1)"/>
  <rect x="102" y="24" width="58"  height="46"  fill="url(#n1)"/>
  <rect x="0"   y="38" width="60"  height="66"  fill="url(#o2)"/>
  <rect x="60"  y="70" width="48"  height="34"  fill="url(#b2)"/>
  <rect x="108" y="70" width="52"  height="34"  fill="url(#w1)"/>
  <!-- seams -->
  <g fill="none" stroke="#030203" stroke-opacity=".85" stroke-width="1.6">
    <path d="M0 .8H160M0 38H60M60 24H160M60 70H160"/>
    <path d="M.8 0V104M60 0V104M102 24V70M108 70V104"/>
  </g>
  <!-- lit top edge -->
  <g fill="none" stroke="#F0EEE8" stroke-opacity=".34" stroke-width="1">
    <path d="M2 2.5H58M62 2.5H158M62 26.5H100M104 26.5H158M2 40.5H58M62 72.5H106M110 72.5H158"/>
  </g>
  <!-- stitches -->
  <g fill="none" stroke="#F0EEE8" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 3">
    <path d="M4 5.5H56M64 5.5H156M64 29.5H98M106 29.5H156M4 43.5H56M64 75.5H104M112 75.5H156"/>
    <path d="M4.5 5V35M64.5 5V21M64.5 29V67M106.5 29V67M4.5 43V101M64.5 75V101M112.5 75V101"/>
  </g>
</svg>
