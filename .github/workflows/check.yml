name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit
      - run: pnpm run test:reference
      - run: pnpm run policy:check
      - run: pnpm run abi:check
      - run: pnpm run test:runtime:portable
      - run: pnpm run test:workers
      - run: pnpm run check:secrets
      # forge test:butuh foundry-rs/setup-foundry; dijalankan di lane kontrak
