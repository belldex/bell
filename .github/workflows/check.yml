name: check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Version comes from package.json "packageManager"; specifying it twice fails the run.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:unit
      - run: pnpm run test:reference
      - run: pnpm run policy:check
      - run: pnpm run abi:check
      - run: pnpm run test:runtime:portable
      - run: pnpm run test:workers
      - run: pnpm run check:secrets
      # forge test needs foundry-rs/setup-foundry; that runs in the contracts lane.
