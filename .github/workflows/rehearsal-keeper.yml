name: BELL rehearsal keeper and pool

# Keeps the Robinhood-testnet rehearsal alive without depending on a laptop being awake.
# The Cloudflare Worker publishes reports every 30s; this workflow is the backstop that
# refreshes health when the Worker cannot (cold start, secret rotation) and creates the pool
# once a tradeable session exists.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bell-rehearsal-keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Report keeper status
        run: node scripts/deploy/ci-rehearsal-status.mjs

      - name: Refresh health when a session is open
        env:
          RH_TESTNET_RPC_PRIMARY: ${{ secrets.RH_TESTNET_RPC_PRIMARY }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          YAHOO_REPORTER_PRIVATE_KEY: ${{ secrets.YAHOO_REPORTER_PRIVATE_KEY }}
          YAHOO_SOURCE_VERIFIER_ADDRESS: ${{ secrets.YAHOO_SOURCE_VERIFIER_ADDRESS }}
        run: node scripts/deploy/ci-rehearsal-tick.mjs

      - name: Create the pool once health is ready
        env:
          RH_TESTNET_RPC_PRIMARY: ${{ secrets.RH_TESTNET_RPC_PRIMARY }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          YAHOO_REPORTER_PRIVATE_KEY: ${{ secrets.YAHOO_REPORTER_PRIVATE_KEY }}
          YAHOO_SOURCE_VERIFIER_ADDRESS: ${{ secrets.YAHOO_SOURCE_VERIFIER_ADDRESS }}
        run: node scripts/deploy/ci-create-pool-if-needed.mjs
