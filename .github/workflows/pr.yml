name: BELL offline PR checks

on:
  pull_request:
    paths:
      - "wealthypeople/BELL/**"
  push:
    paths:
      - "wealthypeople/BELL/**"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wealthypeople/BELL
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.9

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run offline checks
        run: pnpm check

      # Intentionally fails while the pinned Foundry/solc compatibility set is missing.
      # It must not be replaced by a green scaffold-only build.
      - name: Require production build prerequisites
        run: pnpm build
