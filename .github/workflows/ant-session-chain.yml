name: ANT session swaps (self-chaining)

# Claim A5 without depending on GitHub's cron. One run stays up for about five and a half hours, tries the session swap every minute (the script swaps
# only when the calendar says a session is on and that session has no recorded swap, so most tries do nothing and cost nothing), and records each swap
# and the rebuilt proof. Before it ends it starts the next run of itself with the workflow's own token, until PRE, REGULAR, POST and CLOSED are all
# recorded. The six-hourly schedule below only restarts the chain if it was ever broken. The repository is public, so the minutes are free.
# A swap that is sent but does not match the expected fee stops the chain on purpose (it fails the run) instead of retrying with real money.

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ant-session-swaps
  cancel-in-progress: false

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Swap each session as it opens
        env:
          RH_MAINNET_RPC_PRIMARY: ${{ secrets.RH_MAINNET_RPC_PRIMARY }}
          ANT_PROVER_PRIVATE_KEY: ${{ secrets.ANT_PROVER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "bell-keeper"
          git config user.email "bell-keeper@users.noreply.github.com"
          complete() { node -e "const s=require('./evidence/einstein/ant-mainnet-swaps.json').swaps.map(x=>x.session);process.exit(['PRE','REGULAR','POST','CLOSED'].every(p=>s.includes(p))?0:1)"; }
          end=$((SECONDS+19800))
          while [ "$SECONDS" -lt "$end" ]; do
            rc=0
            out=$(node scripts/einstein/ant-session-swap.mjs --auto --i-authorize-spend 2>&1) || rc=$?
            # Stop only when a swap was sent and came out wrong (the script prints the expected fee after it sends). Anything that fails before a
            # transaction is sent, such as the Worker not having a session to report for yet, costs nothing and is tried again in a minute.
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              if echo "$out" | grep -q "pips (expected"; then echo "$out" | tail -8; echo "::error::a swap was sent and did not match; the chain stops here"; touch /tmp/stop; exit 1; fi
              echo "$out" | grep -E "^Error" | tail -1
            fi
            if [ -n "$(git status --porcelain evidence/einstein/ant-mainnet-swaps.json evidence/einstein/ant-mainnet-halt-proofs.json)" ]; then
              echo "$out" | tail -3
              git add evidence/einstein/ant-mainnet-swaps.json evidence/einstein/ant-mainnet-halt-proofs.json
              git commit -q -m "test(einstein): ANT swap recorded"
              if node scripts/einstein/build-ant-proof.mjs --rpc "$RH_MAINNET_RPC_PRIMARY"; then
                git add evidence/einstein/ant/proof.json apps/web/components/einstein/ant-proof.json
                git commit -q -m "test(einstein): ANT proof rebuilt after the new swap" || true
              else
                echo "::warning::the proof rebuild failed; the swap is recorded and the next run rebuilds it"
              fi
              if git pull -q --rebase origin main && git push -q origin HEAD:main; then gh workflow run pages-deploy.yml --repo "$GITHUB_REPOSITORY" || echo "::warning::could not start the site deploy"; else echo "::warning::push failed, retried next time"; fi
            fi
            if complete; then echo "all four sessions are recorded"; touch /tmp/done; break; fi
            sleep 60
          done
          git pull -q --rebase origin main && git push -q origin HEAD:main || true

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/done ] || [ -f /tmp/stop ]; then echo "chain ends here"; exit 0; fi
          gh workflow run ant-session-chain.yml --repo "$GITHUB_REPOSITORY"
