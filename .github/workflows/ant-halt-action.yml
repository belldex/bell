name: ANT halt action

# Sends one REPORTER-signed action to the mainnet HaltRegistry: halt, renew or resume. Each one is hybrid-signed (ECDSA plus one SHRINCS leaf)
# from the signer state on the `pq-state` branch, the same state the delegate renewal uses, so the two workflows share one concurrency group
# and never sign at the same time. Manual only: a halt is a real action on the live ANT pool (CLOSED fee and caps, up to two hours).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "halt, renew or resume"
        type: choice
        options: [halt, renew, resume]
        required: true
      reason:
        description: "Halt reason label (halt only)"
        type: string
        default: "LULD"

permissions:
  contents: write

concurrency:
  group: ant-delegate-renew
  cancel-in-progress: false

jobs:
  act:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: pq-state
          path: pq-state

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - name: Install
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          (cd contracts/pq/signer && npm ci --no-audit --no-fund)
          mkdir -p contracts/pq/keys/robinhood-4663
          cp pq-state/reporter.enc pq-state/reporter.public.json contracts/pq/keys/robinhood-4663/

      - name: Send the action
        env:
          RH_MAINNET_RPC_PRIMARY: ${{ secrets.RH_MAINNET_RPC_PRIMARY }}
          YAHOO_REPORTER_PRIVATE_KEY: ${{ secrets.YAHOO_REPORTER_PRIVATE_KEY }}
          ANT_SENDER_PRIVATE_KEY: ${{ secrets.ANT_SENDER_PRIVATE_KEY }}
          BELL_PQ_MAINNET_ENCRYPTION_KEY: ${{ secrets.BELL_PQ_MAINNET_ENCRYPTION_KEY }}
          ACTION: ${{ inputs.action }}
          REASON: ${{ inputs.reason }}
        run: |
          case "$ACTION" in
            halt|renew|resume) ;;
            *) echo "unknown action"; exit 1;;
          esac
          node scripts/einstein/halt-reporter.mjs "$ACTION" --network mainnet --asset ANT --reason "$REASON" --broadcast --i-authorize-spend

      - name: Save the signer state
        if: always()
        run: |
          cp contracts/pq/keys/robinhood-4663/reporter.enc contracts/pq/keys/robinhood-4663/reporter.public.json pq-state/
          cd pq-state
          git config user.name "bell-keeper"
          git config user.email "bell-keeper@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add reporter.enc reporter.public.json
            git commit -m "signer state after halt action run $GITHUB_RUN_NUMBER"
            git push origin HEAD:pq-state
          fi
