name: Calendar autorenew

# Renews the mainnet calendar roots of the PQ stack (ANT and NVDA) with no one at a keyboard. The registry accepts a new root only when it starts where
# the active one ends, and a root queued late burns its (asset, year) slot for good, so this runs every three hours and each run reads the asset's
# state and the chain time and does only the one step that is due: queue the next root in the last 30 days of the current one, execute the governance
# call after its delay, activate the root after its delay, activate the first interval when its coverage starts. Every step is signed by the GOVERNANCE
# role (ECDSA plus one SHRINCS leaf) from the signer state on the `pq-state` branch. A step that is not due is not an error; a window that was
# missed fails the run loudly, and the ant-health workflow opens an issue when a root is close to ending with no next root queued.
#
# The GOVERNANCE role pauses, admits assets and signs every calendar root, so its key and signer state are repository secrets and the signer state
# lives on the pq-state branch, encrypted. Keep write access to this repository and its secrets tight.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Only print the decision, send nothing"
        type: boolean
        default: false
      simulate:
        description: "Also simulate the queue step for ANT with the real signer (decrypts the state, builds both signatures, sends nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ant-delegate-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: pq-state
          path: pq-state

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - name: Install
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          (cd contracts/pq/signer && npm ci --no-audit --no-fund)
          mkdir -p contracts/pq/keys/robinhood-4663
          cp pq-state/governance.enc pq-state/governance.public.json pq-state/reporter.enc pq-state/reporter.public.json contracts/pq/keys/robinhood-4663/

      - name: ANT
        id: ant
        continue-on-error: true
        env:
          RH_MAINNET_RPC_PRIMARY: ${{ secrets.RH_MAINNET_RPC_PRIMARY }}
          RH_MAINNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.RH_MAINNET_DEPLOYER_PRIVATE_KEY }}
          BELL_PQ_MAINNET_ENCRYPTION_KEY: ${{ secrets.BELL_PQ_MAINNET_ENCRYPTION_KEY }}
          DRY: ${{ inputs.dry }}
        run: |
          flag=""; if [ "$DRY" = "true" ]; then flag="--dry"; fi
          node scripts/deploy/calendar-autorenew.mjs --asset ANT $flag

      - name: NVDA
        id: nvda
        continue-on-error: true
        env:
          RH_MAINNET_RPC_PRIMARY: ${{ secrets.RH_MAINNET_RPC_PRIMARY }}
          RH_MAINNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.RH_MAINNET_DEPLOYER_PRIVATE_KEY }}
          BELL_PQ_MAINNET_ENCRYPTION_KEY: ${{ secrets.BELL_PQ_MAINNET_ENCRYPTION_KEY }}
          DRY: ${{ inputs.dry }}
        run: |
          flag=""; if [ "$DRY" = "true" ]; then flag="--dry"; fi
          node scripts/deploy/calendar-autorenew.mjs --asset NVDA $flag

      - name: Simulate the queue step
        if: inputs.simulate
        env:
          RH_MAINNET_RPC_PRIMARY: ${{ secrets.RH_MAINNET_RPC_PRIMARY }}
          RH_MAINNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.RH_MAINNET_DEPLOYER_PRIVATE_KEY }}
          BELL_PQ_MAINNET_ENCRYPTION_KEY: ${{ secrets.BELL_PQ_MAINNET_ENCRYPTION_KEY }}
          EINSTEIN_NETWORK: mainnet
          BELL_CALENDAR_DAYS: "365"
          BELL_CALENDAR_STATE_PREFIX: evidence/deploy/pq-hooks-mainnet-calendar-state
          ANT_STATE: evidence/deploy/mainnet-4663-ant.json
        run: node scripts/deploy/testnet-einstein-calendar.mjs queue --asset=ANT

      - name: Save the signer state
        if: always()
        run: |
          cp contracts/pq/keys/robinhood-4663/governance.enc contracts/pq/keys/robinhood-4663/governance.public.json pq-state/
          cd pq-state
          git config user.name "bell-keeper"
          git config user.email "bell-keeper@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add governance.enc governance.public.json
            git commit -m "governance signer state after calendar run $GITHUB_RUN_NUMBER"
            git push origin HEAD:pq-state
          fi

      - name: Commit the calendar state
        if: always()
        run: |
          git config user.name "bell-keeper"
          git config user.email "bell-keeper@users.noreply.github.com"
          for f in evidence/deploy/pq-hooks-mainnet-calendar-state-ANT.json evidence/deploy/pq-hooks-mainnet-calendar-state-NVDA.json evidence/deploy/calendar-roots-ANT.json evidence/deploy/calendar-roots-NVDA.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "calendar: autorenew step"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail if a step failed
        if: steps.ant.outcome == 'failure' || steps.nvda.outcome == 'failure'
        run: exit 1
