name: ANT halt watcher

# Reads Robinhood's own `isTradingHalt` flag for ANT (api.robinhood.com/rhj/prices/ANT) and records a halt, a renewal or a resume on the mainnet
# HaltRegistry through the same hybrid-signed REPORTER path as the manual `ant-halt-action` workflow (one SHRINCS leaf per action, from the signer
# state on the `pq-state` branch). It reads twice, 45 seconds apart, and acts only when both reads agree and the quote is fresh; a missing or stale
# quote never causes an action, and the registry's own two hour expiry is the fail-safe if this stops running.
#
# What this source is: Robinhood's flag, not the exchange's halt feed. It carries no start time, so the registry records the time the flag was
# first seen and `reportDelay` measures nothing about the exchange's own delay. It lands on chain some minutes after the real halt.
#
# SWITCHED OFF BY DEFAULT: the schedule is commented out until the owner decides that this source may halt the live pool. Run it by hand with
# workflow_dispatch to test it; while the flag is not set it only reads.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ant-delegate-renew
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: pq-state
          path: pq-state

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - name: Install
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          (cd contracts/pq/signer && npm ci --no-audit --no-fund)
          mkdir -p contracts/pq/keys/robinhood-4663
          cp pq-state/reporter.enc pq-state/reporter.public.json contracts/pq/keys/robinhood-4663/

      - name: Watch
        env:
          RH_MAINNET_RPC_PRIMARY: ${{ secrets.RH_MAINNET_RPC_PRIMARY }}
          YAHOO_REPORTER_PRIVATE_KEY: ${{ secrets.YAHOO_REPORTER_PRIVATE_KEY }}
          ANT_SENDER_PRIVATE_KEY: ${{ secrets.ANT_SENDER_PRIVATE_KEY }}
          BELL_PQ_MAINNET_ENCRYPTION_KEY: ${{ secrets.BELL_PQ_MAINNET_ENCRYPTION_KEY }}
        run: node scripts/einstein/halt-watcher.mjs tick --network mainnet --asset ANT --symbol ANT --confirm-wait 45 --broadcast --i-authorize-spend

      - name: Save the signer state
        if: always()
        run: |
          cp contracts/pq/keys/robinhood-4663/reporter.enc contracts/pq/keys/robinhood-4663/reporter.public.json pq-state/
          cd pq-state
          git config user.name "bell-keeper"
          git config user.email "bell-keeper@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add reporter.enc reporter.public.json
            git commit -m "signer state after watcher run $GITHUB_RUN_NUMBER"
            git push origin HEAD:pq-state
          fi
