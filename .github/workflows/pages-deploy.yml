name: Deploy site to Cloudflare Pages

# bellstocks.tech is served by the Cloudflare Pages project bell-web (www.bellstocks.tech is a CNAME to bell-web.pages.dev). This builds the static
# export of apps/web and uploads it. It runs on every push that touches something the web app reads, and every 30 minutes it also deploys when such a
# change landed in the last 40 minutes. The second path is needed because commits made by other workflows with the workflow token (swap evidence, proof
# rebuilds) do not start push-triggered runs. Direct uploads have no daily deploy limit.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/auction-cli/**"
      - "scripts/deploy/mainnet-pool-config.mjs"
      - "evidence/deploy/mainnet-4663*.json"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages-deploy.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 50

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git log --since="40 minutes ago" --name-only --pretty=format: -- apps/web packages scripts/auction-cli scripts/deploy/mainnet-pool-config.mjs 'evidence/deploy/mainnet-4663*.json' pnpm-lock.yaml package.json pnpm-workspace.yaml | sort -u | grep -c . || true)
          if [ "$changed" -gt 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "nothing changed for the site"; echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.decide.outputs.go == 'true'
        with:
          node-version: 24.15.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.decide.outputs.go == 'true'
        with:
          version: 9.15.0
          run_install: false

      - name: Install
        if: steps.decide.outputs.go == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        if: steps.decide.outputs.go == 'true'
        run: pnpm --filter @bell/web build

      - name: Deploy
        if: steps.decide.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy apps/web/out --project-name bell-web --branch main --commit-hash "$GITHUB_SHA" --commit-message "deploy $GITHUB_SHA"
