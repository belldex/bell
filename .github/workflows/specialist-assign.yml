name: Specialist assign

# Assigns a bonded Specialist to NVDA on a SpecialistRegistry. The call is hybrid-signed by the GOVERNANCE role (ECDSA plus one SHRINCS leaf) from the
# signer state on the `pq-state` branch, the same state the calendar renewal uses, so it shares that workflow's concurrency group and the two never sign
# at the same time. Manual only: an assignment names the one bonded market maker for a stock.

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Registry instance: test or production"
        type: choice
        options: [test, production]
        required: true
      specialist:
        description: "The bonded Specialist address"
        type: string
        required: true
      dry:
        description: "Only simulate with the real signer, send nothing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ant-delegate-renew
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: pq-state
          path: pq-state

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - name: Install
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          (cd contracts/pq/signer && npm ci --no-audit --no-fund)
          mkdir -p contracts/pq/keys/robinhood-4663
          cp pq-state/governance.enc pq-state/governance.public.json contracts/pq/keys/robinhood-4663/

      - name: Assign
        env:
          RH_MAINNET_RPC_PRIMARY: ${{ secrets.RH_MAINNET_RPC_PRIMARY }}
          RH_MAINNET_DEPLOYER_PRIVATE_KEY: ${{ secrets.RH_MAINNET_DEPLOYER_PRIVATE_KEY }}
          BELL_PQ_MAINNET_ENCRYPTION_KEY: ${{ secrets.BELL_PQ_MAINNET_ENCRYPTION_KEY }}
          LABEL: ${{ inputs.label }}
          SPECIALIST: ${{ inputs.specialist }}
          DRY: ${{ inputs.dry }}
        run: |
          case "$LABEL" in test|production) ;; *) echo "unknown label"; exit 1;; esac
          if ! echo "$SPECIALIST" | grep -Eq '^0x[0-9a-fA-F]{40}$'; then echo "bad address"; exit 1; fi
          flag="--broadcast"; if [ "$DRY" = "true" ]; then flag=""; fi
          node scripts/specialist/assign.mjs --label "$LABEL" --specialist "$SPECIALIST" $flag | tee assign.log

      - name: Save the signer state
        if: always()
        run: |
          cp contracts/pq/keys/robinhood-4663/governance.enc contracts/pq/keys/robinhood-4663/governance.public.json pq-state/
          cd pq-state
          git config user.name "bell-keeper"
          git config user.email "bell-keeper@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add governance.enc governance.public.json
            git commit -m "governance signer state after specialist assign run $GITHUB_RUN_NUMBER"
            git push origin HEAD:pq-state
          fi
